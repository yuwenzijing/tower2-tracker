<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永恒之塔2 · 统计</title>
<link rel="preload" href="/app.js?v=1.3.8.3" as="script">
<style>
  :root {
    --bg: #080c16;
    --bg-card: rgba(16,22,40,0.75);
    --bg-card-hover: rgba(24,32,56,0.85);
    --bg-char: rgba(12,18,32,0.7);
    --border: rgba(40,56,90,0.45);
    --border-glow: rgba(60,90,140,0.6);
    --gold: #f0cc55;
    --gold-dim: #b09a42;
    --blue: #5aabff;
    --blue-dim: #3468b0;
    --cyan: #22ddff;
    --green: #5ae890;
    --red: #ff8080;
    --purple: #c89dff;
    --text: #e8ecf4;
    --text-dim: #90a4c4;
    --text-faint: #607090;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 1px rgba(255,255,255,0.05);
    --glass-blur: blur(16px);
    --glass-bg: rgba(16,22,42,0.6);
    --glass-border: rgba(255,255,255,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] { -moz-appearance: textfield; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 15% -5%, rgba(34,221,255,0.10), transparent 45%),
      radial-gradient(ellipse at 85% 100%, rgba(240,204,85,0.06), transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(90,100,255,0.03), transparent 60%);
  }

  /* ===== Header ===== */
  header {
    text-align: center;
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--glass-border);
    background: linear-gradient(180deg, rgba(34,221,255,0.07), rgba(90,170,255,0.02), transparent);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
  }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--cyan), #80d0ff, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(34,221,255,0.15);
  }
  .version-tag {
    font-size: 13px;
    font-weight: 400;
    -webkit-text-fill-color: var(--text-faint);
    opacity: 0.7;
    letter-spacing: 1px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* ===== Today Activities ===== */
  .today-activities {
    background: var(--glass-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 0;
    overflow: hidden;
    flex-shrink: 0;
    min-width: 160px;
    max-width: 220px;
  }
  .today-activities-head {
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 1px;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(34,221,255,0.04);
  }
  .today-activities-body {
    position: relative;
    overflow: hidden;
    min-height: 32px;
  }
  .activity-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--text-dim);
    transition: color 0.3s, background 0.3s;
    white-space: nowrap;
  }
  .activity-item .act-time {
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .activity-item .act-name {
    color: var(--text);
  }
  .activity-item.urgent .act-time,
  .activity-item.urgent .act-name {
    color: var(--red);
    font-weight: 600;
  }
  .activity-item.urgent {
    background: rgba(255,128,128,0.06);
  }

  /* ===== Summary Bar ===== */
  .summary-bar-wrap {
    border-bottom: 1px solid var(--glass-border);
    background: rgba(10,14,26,0.4);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
  }
  .summary-bar {
    display: flex;
    gap: 14px;
    padding: 16px 20px;
    flex-wrap: wrap;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto;
  }
  .summary-chip {
    background: var(--glass-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 20px;
    text-align: center;
    min-width: 120px;
    flex-shrink: 0;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .summary-chip .val {
    font-size: 22px;
    font-weight: 700;
    color: var(--red);
  }
  .summary-chip.gold .val { color: var(--gold); }
  .summary-chip.cyan .val { color: var(--cyan); }
  .summary-chip .label {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 3px;
  }
  /* 总剩余奥德感叹号提示 */
  .aode-tip-btn {
    display: inline-block;
    margin-left: 3px;
    color: var(--cyan);
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    user-select: none;
    opacity: 0.7;
    font-size: inherit;
  }
  .aode-tip-btn:hover { opacity: 1; }
  .aode-tip-popup {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--glass-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    z-index: 200;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .aode-tip-popup.show { display: block; }
  .aode-tip-popup::before {
    content: '';
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-bottom-color: var(--border);
  }
  .cap-names {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-wrap: wrap;
    align-items: flex-start;
    align-content: flex-start;
    flex: 1;
    max-height: calc(32px * 3 + 8px);
  }
  .cap-name-badge {
    padding: 4px 14px;
    border-radius: 8px;
    background: rgba(255,128,128,0.08);
    border: 1px solid rgba(255,128,128,0.25);
    color: var(--red);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    line-height: 1.4;
    transition: all 0.2s;
    user-select: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .cap-name-badge:hover {
    background: rgba(255,128,128,0.16);
    border-color: var(--red);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(255,128,128,0.12);
  }
  .cap-names-empty {
    color: var(--text-faint);
    font-size: 13px;
  }

  /* ===== Main ===== */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar h2 {
    font-size: 16px;
    color: var(--text-dim);
    font-weight: 500;
    flex-shrink: 0;
  }
  .simple-mode-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: default;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
    user-select: none;
    flex: 1;
    justify-content: center;
    white-space: nowrap;
  }
  .simple-mode-toggle input { cursor: pointer; width: 15px; height: 15px; accent-color: var(--purple); }
  .toolbar-toggles {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .toolbar-sep {
    color: var(--border);
    font-size: 14px;
    margin: 0 2px;
    user-select: none;
  }
  .cost-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    user-select: none;
  }
  .cost-toggle-label {
    color: var(--text-faint);
    font-size: 12px;
    white-space: nowrap;
  }
  .cost-toggle-val {
    display: inline-block;
    min-width: 32px;
    text-align: center;
    padding: 2px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--glass-bg);
    font-weight: 700;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cost-toggle-val:hover { border-color: var(--gold); background: rgba(255,215,0,0.08); }
  .toolbar-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .tool-btn {
    padding: 7px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--glass-bg);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .tool-btn:hover {
    background: var(--bg-card-hover);
    color: var(--text);
    border-color: var(--blue);
    box-shadow: 0 2px 12px rgba(90,170,255,0.1);
  }
  .tool-btn.export:hover { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 2px 12px rgba(34,221,255,0.12); }
  .tool-btn.import:hover { color: var(--gold); border-color: var(--gold); box-shadow: 0 2px 12px rgba(240,204,85,0.12); }
  .tool-btn.sync:hover { color: var(--green); border-color: var(--green); box-shadow: 0 2px 12px rgba(90,232,144,0.12); }
  .tool-btn.sync.synced { color: var(--green); border-color: rgba(90,232,144,0.4); background: rgba(90,232,144,0.08); }
  .tool-btn.sync.syncing { color: var(--blue); border-color: rgba(90,170,255,0.4); background: rgba(90,170,255,0.08); animation: syncPulse 1s infinite; }
  .tool-btn.sync.error { color: var(--red); border-color: rgba(255,128,128,0.4); background: rgba(255,128,128,0.08); }
  @keyframes syncPulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  .tool-btn.undo { transition: all 0.2s; }
  .tool-btn.undo:not(:disabled):hover { color: var(--gold); border-color: var(--gold); box-shadow: 0 2px 12px rgba(240,204,85,0.12); }
  .tool-btn.undo:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ===== Sync ===== */

  .modal-overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .sync-modal-overlay {
    background: rgba(0,0,0,0.6);
    z-index: 1000;
  }
  .sync-modal {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: var(--radius);
    padding: 24px 24px 20px;
    max-width: 480px;
    position: relative;
    width: 90%;
    box-shadow: var(--shadow);
  }
  .sync-modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-faint);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    line-height: 1;
  }
  .sync-modal-close:hover { color: var(--text); border-color: var(--text-dim); background: rgba(255,255,255,0.04); }
  .sync-modal h3 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--text);
    padding-right: 36px;
  }
  .sync-modal p {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .sync-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(0,0,0,0.3);
    color: var(--text);
    font-size: 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .sync-input:focus { border-color: var(--cyan); }
  .sync-input::placeholder { color: var(--text-faint); }
  .sync-modal-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 16px;
  }
  .sync-modal-actions.cols-2 {
    grid-template-columns: repeat(2, 1fr);
  }
  .sync-btn {
    padding: 10px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--glass-bg);
    color: var(--text-dim);
    white-space: nowrap;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .sync-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .sync-btn.primary {
    background: rgba(34,221,255,0.15);
    color: var(--cyan);
    border-color: rgba(34,221,255,0.3);
  }
  .sync-btn.primary:hover { background: rgba(34,221,255,0.25); }
  .sync-conflict-info {
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
  }
  .sync-conflict-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 13px;
  }
  .sync-conflict-row .label { color: var(--text-dim); }
  .sync-conflict-row .time { color: var(--text); font-family: monospace; font-size: 12px; }
  .sync-conflict-actions {
    display: flex;
    gap: 8px;
  }
  .sync-btn.use-local { color: var(--cyan); border-color: rgba(34,221,255,0.3); }
  .sync-btn.use-local:hover { background: rgba(34,221,255,0.1); }
  .sync-btn.use-cloud { color: var(--gold); border-color: rgba(240,204,85,0.3); }
  .sync-btn.use-cloud:hover { background: rgba(240,204,85,0.1); }

  /* ===== Account Card ===== */
  .account-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 18px;
    overflow: hidden;
    transition: border-color 0.25s, box-shadow 0.3s;
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .account-card:hover { border-color: var(--border-glow); box-shadow: 0 4px 24px rgba(0,0,0,0.35); }
  .account-header {
    display: flex;
    align-items: center;
    padding: 12px 18px;
    background: linear-gradient(90deg, rgba(90,170,255,0.07), rgba(34,221,255,0.02), transparent);
    border-bottom: 1px solid var(--glass-border);
    gap: 14px;
    flex-wrap: wrap;
  }
  .acc-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .account-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue-dim), var(--blue));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(90,170,255,0.2);
  }
  .account-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    border-bottom: 1px dashed transparent;
    padding: 2px 4px;
    font-family: inherit;
    min-width: 70px;
  }
  .account-name:focus { border-bottom-color: var(--blue); }
  .char-count-tag {
    font-size: 11px;
    color: var(--text-faint);
    white-space: nowrap;
  }
  .acc-stats {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    flex: 1;
    justify-content: center;
  }
  .acc-stat {
    display: flex;
    align-items: baseline;
    gap: 4px;
    white-space: nowrap;
  }
  .acc-stat .stat-label {
    color: var(--text-faint);
    font-size: 11px;
  }
  .acc-stat .stat-val {
    font-weight: 700;
    font-size: 16px;
  }
  .acc-stat.aode .stat-val { color: var(--cyan); }
  .acc-stat.dungeon .stat-val { color: var(--gold); }
  .acc-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .membership-select {
    background: rgba(8,12,22,0.6);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .membership-select:hover { border-color: var(--blue); }
  .membership-select:focus { border-color: var(--gold); box-shadow: 0 0 6px rgba(240,204,85,0.1); }
  .membership-select option { background: #101628; color: var(--text); }
  .mem-time {
    display: flex;
    align-items: center;
    gap: 2px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
  }
  .mem-time-input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text-dim);
    padding: 2px 2px;
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    width: 28px;
    text-align: center;
    outline: none;
    transition: border-bottom-color 0.2s, color 0.2s;
  }
  .mem-time-input::placeholder { color: var(--text-faint); font-weight: 400; font-size: 10px; }
  .mem-time-input:focus { border-bottom-color: var(--blue); }
  .mem-time-unit { font-size: 11px; color: var(--text-faint); }
  .mem-time.urgent .mem-time-input,
  .mem-time.urgent .mem-time-unit { color: var(--red); font-weight: 800; }

  .icon-btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    color: var(--text-dim);
    width: 30px; height: 30px;
    border-radius: 8px;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    font-family: inherit;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--bg-card-hover); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .icon-btn.danger:hover { color: var(--red); border-color: rgba(255,80,80,0.3); background: rgba(255,80,80,0.06); }

  /* ===== Directive Section (账号指令书) ===== */
  .directive-section {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--glass-border);
    flex-wrap: wrap;
  }
  .directive-label {
    font-size: 12px;
    color: var(--text-faint);
    margin-right: 6px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .directive-sep {
    color: var(--text-faint);
    font-size: 14px;
    opacity: 0.4;
    margin: 0 2px;
    user-select: none;
  }
  .directive-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    font-size: 13px;
  }
  .directive-item:hover { background: rgba(255,255,255,0.04); }
  .directive-item .todo-checkbox {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1.5px solid var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: transparent;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .directive-item.done {
    border-color: rgba(90,232,144,0.15);
    background: rgba(90,232,144,0.05);
  }
  .directive-item.done .todo-checkbox {
    border-color: var(--green);
    background: var(--green);
    color: var(--bg);
    box-shadow: 0 0 6px rgba(90,232,144,0.3);
  }
  .directive-item.done .todo-label {
    color: var(--green);
  }

  /* ===== Character List ===== */
  .char-list {
    padding: 12px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .char-card {
    position: relative;
    background: var(--bg-char);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.25s, box-shadow 0.35s, opacity 0.2s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .char-card > * { position: relative; z-index: 1; }
  .char-card:hover { border-color: var(--border-glow); box-shadow: 0 2px 16px rgba(0,0,0,0.2); }

  /* Class-based accent colors */
  .char-card.cls-sword    { --cls-color:#f87171; --cls-rgb:248,113,113; }
  .char-card.cls-guardian { --cls-color:#4a9eff; --cls-rgb:74,158,255; }
  .char-card.cls-chanter  { --cls-color:#f59e0b; --cls-rgb:245,158,11; }
  .char-card.cls-cleric   { --cls-color:#4ade80; --cls-rgb:74,222,128; }
  .char-card.cls-ranger   { --cls-color:#84cc16; --cls-rgb:132,204,22; }
  .char-card.cls-sorcerer { --cls-color:#c084fc; --cls-rgb:192,132,252; }
  .char-card.cls-spirit   { --cls-color:#06b6d4; --cls-rgb:6,182,212; }
  .char-card.cls-assassin { --cls-color:#a78bfa; --cls-rgb:167,139,250; }
  .char-card.cls-fighter  { --cls-color:#e8c547; --cls-rgb:232,197,71; }
  .char-card[class*="cls-"] {
    border-left: 3px solid var(--cls-color);
    background: linear-gradient(90deg, rgba(var(--cls-rgb),0.04), var(--bg-char) 40%);
  }
  .char-card[class*="cls-"]:hover {
    border-left-color: var(--cls-color);
    box-shadow: -4px 0 16px rgba(var(--cls-rgb),0.08);
  }
  .char-card.highlight {
    border-color: var(--gold) !important;
    box-shadow: 0 0 28px rgba(240,204,85,0.25), inset 0 0 40px rgba(240,204,85,0.03);
    animation: pulse 0.5s ease-in-out 3;
  }
  .char-card.selected {
    border-color: var(--cyan) !important;
    box-shadow: 0 0 20px rgba(34,221,255,0.12), inset 0 0 30px rgba(34,221,255,0.02);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.01); }
  }

  /* Drag and drop */
  .char-card.dragging {
    opacity: 0.4;
    border-color: var(--purple) !important;
  }
  .char-card.drag-over {
    border-color: var(--purple) !important;
    box-shadow: 0 0 16px rgba(200,157,255,0.2);
  }
  .char-header[draggable="true"] { cursor: grab; }
  .char-header[draggable="true"]:active { cursor: grabbing; }
  .char-header[draggable="true"] input { cursor: text; }
  .char-header[draggable="true"] select { cursor: pointer; }

  /* Character delete (hover) */
  .char-delete {
    position: absolute;
    top: 1px;
    right: 1px;
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-faint);
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s, color 0.2s;
    z-index: 10;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .char-card:hover .char-delete { opacity: 0.45; }
  .char-delete:hover { opacity: 1 !important; color: var(--red); border-color: rgba(255,80,80,0.3); background: rgba(255,80,80,0.08); }

  .char-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--glass-border);
    gap: 8px;
    flex-wrap: nowrap;
    background: rgba(255,255,255,0.01);
  }
  .char-header .left {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1 1 0;
    min-width: 0;
    flex-wrap: nowrap;
  }
  .char-header .center {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
    flex-wrap: nowrap;
  }
  .char-header .right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1 1 0;
    justify-content: flex-end;
    flex-wrap: nowrap;
    margin-right: 8px;
  }
  .char-icon { font-size: 16px; }
  .char-icon-img {
    height: 28px;
    width: 28px;
    object-fit: contain;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .char-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    border-bottom: 1px dashed transparent;
    padding: 2px 2px;
    font-family: inherit;
    min-width: 32px;
    width: auto;
    flex: 0 1 auto;
  }
  .char-name:focus { border-bottom-color: var(--purple); }
  .char-name::placeholder { color: var(--text-faint); font-weight: 400; font-size: 12px; }

  /* ===== Class Dropdown ===== */
  .class-select {
    background: rgba(8,12,22,0.6);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 2px 4px;
    border-radius: 6px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
    flex-shrink: 0;
  }
  .class-select:hover { border-color: var(--purple); }
  .class-select:focus { border-color: var(--gold); }
  .class-select option { background: #101628; color: var(--text); }

  /* ===== Stat Inputs (Item Level / Combat Power) ===== */
  .stat-group {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .stat-group .combat-unit-select { display: none !important; }
  .stat-group.editing .combat-unit-select { display: inline-block !important; }
  .stat-group.editing .combat-unit-label { display: none; }
  .stat-input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text);
    padding: 2px 2px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    width: 48px;
    text-align: center;
    outline: none;
    transition: border-bottom-color 0.2s, color 0.2s;
    flex-shrink: 0;
  }
  .stat-group .stat-input { text-align: right; }
  .stat-input::placeholder { color: var(--text-faint); font-weight: 400; font-size: 10px; }
  .stat-input:focus { border-bottom-color: var(--gold); }
  .stat-suffix {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
  }
  select.stat-suffix {
    background: transparent;
    border: 0;
    padding: 0;
    margin-left: 2px;
    cursor: pointer;
    font-family: inherit;
  }

  /* ===== Character Subtitle (Dungeon Count) ===== */
  .char-subtitle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-bottom: 1px solid var(--glass-border);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    background: linear-gradient(90deg, rgba(240,204,85,0.04), transparent);
  }
  .char-subtitle .dungeon-count {
    font-size: 16px;
    font-weight: 800;
    color: var(--gold);
  }
  .char-subtitle .dungeon-unit {
    font-size: 11px;
    color: var(--gold-dim);
    font-weight: 600;
  }
  .energy-ops {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  .energy-op-btn {
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--glass-bg);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    user-select: none;
  }
  .energy-op-btn:not(:disabled):hover {
    color: var(--text);
    border-color: var(--text-dim);
    background: var(--bg-card-hover);
  }
  .energy-op-btn:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }
  .energy-op-btn.sub { color: var(--red); border-color: rgba(255,128,128,0.2); }
  .energy-op-btn.sub:not(:disabled):hover { border-color: var(--red); background: rgba(255,128,128,0.08); }
  .energy-op-btn.add { color: var(--green); border-color: rgba(90,232,144,0.2); }
  .energy-op-btn.add:not(:disabled):hover { border-color: var(--green); background: rgba(90,232,144,0.08); }
  .energy-op-btn.undo-icon {
    font-size: 14px;
    padding: 4px 8px;
    color: var(--text-faint);
  }
  .energy-op-btn.undo-icon:not(:disabled):hover { color: var(--gold); border-color: var(--gold); }
  .energy-op-btn.undo-icon sup { font-size: 9px; margin-left: 1px; font-weight: 700; }
  .energy-op-btn.ocr-btn {
    padding: 4px 8px;
    color: var(--cyan);
    border-color: rgba(34,221,255,0.25);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .energy-op-btn.ocr-btn:not(:disabled):hover {
    color: var(--cyan);
    border-color: var(--cyan);
    background: rgba(34,221,255,0.1);
  }
  .energy-op-btn.ocr-btn svg { display: block; }

  /* ===== Energy Pools (simplified) ===== */
  .energy-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px 14px;
  }
  .energy-pool {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    transition: all 0.3s;
    min-width: 0;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    text-align: center;
    display: flex;
    flex-direction: column;
  }
  .energy-pool.white {
    border-left: 3px solid var(--cyan);
    box-shadow: inset 2px 0 12px rgba(34,221,255,0.06);
    background: linear-gradient(to right, rgba(34,221,255,0.08), rgba(34,221,255,0.02) 50%, transparent);
  }
  .energy-pool.blue {
    border-left: 3px solid var(--blue);
    box-shadow: inset 2px 0 12px rgba(90,170,255,0.06);
    background: linear-gradient(to right, rgba(90,170,255,0.08), rgba(90,170,255,0.02) 50%, transparent);
  }
  .pool-title {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 4px;
  }
  .pool-title.white-title { color: var(--cyan); }
  .pool-title.blue-title { color: var(--blue); }
  .energy-display {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    margin: 2px 0;
  }
  .energy-input-simple {
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text);
    padding: 2px 2px;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    width: 64px;
    text-align: center;
    outline: none;
    transition: border-bottom-color 0.2s;
  }
  .energy-input-simple:focus { border-bottom-color: var(--gold); }

  /* Backpack aode */
  .backpack-aode {
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px dashed var(--glass-border);
    font-size: 11px;
    color: var(--text-faint);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 28px;
  }
  .backpack-input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text);
    padding: 1px 2px;
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    width: 34px;
    text-align: center;
    outline: none;
    transition: border-bottom-color 0.2s;
  }
  .backpack-input:focus { border-bottom-color: var(--gold); }
  .backpack-input::placeholder { color: var(--text-faint); font-weight: 400; font-size: 10px; }
  .backpack-energy-hint {
    font-size: 10px;
    color: var(--text-faint);
    font-weight: 400;
  }
  .recovery-info {
    text-align: center;
    font-size: 10px;
    color: var(--text-faint);
    font-weight: 400;
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px dashed var(--glass-border);
    min-height: 28px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .recovery-info .time { color: var(--gold); font-weight: 600; }
  .recovery-info .full-tag { color: var(--green); font-weight: 600; }

  /* ===== Todo Section ===== */
  .todo-section {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid var(--glass-border);
  }
  .todo-section.sanctuary-row {
    position: relative;
    z-index: 60;
    overflow: visible;
    border-top: none;
  }
  .todo-item.sanctuary-slot {
    position: relative;
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr);
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 5px 10px;
    overflow: visible;
  }
  .account-card.sanctuary-menu-open { position: relative; z-index: 40; overflow: visible; }
  .char-card.sanctuary-menu-open { position: relative; z-index: 50; overflow: visible; }
  .todo-item.sanctuary-slot.empty { cursor: default; }
  .sanctuary-trigger {
    display: block;
    align-items: center;
    width: 100%;
    height: auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text-dim);
    font: 600 12px/1.4 "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    text-align: left;
    cursor: pointer;
    padding: 0 30px 0 0;
  }
  .sanctuary-trigger:hover, .sanctuary-trigger:focus-visible { color: var(--text); }
  .sanctuary-trigger:focus-visible { box-shadow: inset 0 0 0 1px var(--cyan); border-radius: 7px; }
  .sanctuary-slot.done .sanctuary-trigger { color: var(--green); }
  .sanctuary-trigger-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sanctuary-clear, .sanctuary-option-check {
    font-family: "Segoe MDL2 Assets";
    font-weight: 400;
  }
  .sanctuary-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 70;
    width: 20px;
    height: 20px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #7890ad;
    opacity: .48;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    box-shadow: none;
    transition: color .16s ease, opacity .16s ease, background .16s ease;
  }
  .sanctuary-clear:hover, .sanctuary-clear:focus-visible {
    color: #ff8192;
    opacity: 1;
    background: rgba(255,97,118,.08);
    outline: none;
  }
  .sanctuary-menu {
    position: absolute;
    z-index: 100;
    top: calc(100% + 6px);
    left: 10px;
    right: 0;
    padding: 5px;
    border: 1px solid rgba(70,108,150,.72);
    border-radius: 9px;
    background: #0a1729;
    box-shadow: 0 14px 32px rgba(0,0,0,.5), 0 0 0 1px rgba(34,221,255,.05);
  }
  .sanctuary-option {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 16px;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 9px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #b8c8dc;
    font: 600 12px/1.25 "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    text-align: left;
    cursor: pointer;
  }
  .sanctuary-option:hover, .sanctuary-option:focus-visible {
    color: #e7f8ff;
    background: rgba(34,221,255,.1);
    outline: none;
  }
  .sanctuary-option.selected { color: var(--green); background: rgba(90,232,144,.08); }
  .sanctuary-option-check { color: var(--green); font-size: 11px; text-align: center; }
  .todo-subtitle {
    height: 31px;
    padding: 0 14px;
    border-top: 1px solid var(--glass-border);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    background: linear-gradient(90deg, rgba(90,170,255,0.08), rgba(34,221,255,0.03));
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    box-sizing: border-box;
  }
  .todo-heading { flex: 0 0 auto; white-space: nowrap; }
  .todo-subtitle .todo-count { font-weight: 800; }
  .todo-subtitle .todo-count.all { color: var(--green); }
  .todo-subtitle .todo-count.none { color: var(--red); }
  .todo-subtitle .todo-count.partial { color: #e8c040; }
  .char-note-area {
    margin-left: auto;
    flex: 1 1 auto;
    min-width: 0;
    max-width: min(62%, 560px);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 7px;
    overflow: hidden;
  }
  .char-note-icon,
  .char-note-edit {
    font-family: "Segoe MDL2 Assets";
    font-weight: 400;
    font-style: normal;
    flex: 0 0 auto;
  }
  .char-note-icon { color: var(--text-dim); font-size: 14px; }
  .char-note-edit {
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color .2s, background .2s;
  }
  .char-note-edit:hover,
  .char-note-edit:focus-visible {
    color: var(--cyan);
    background: rgba(34,221,255,.06);
    outline: none;
  }
  .char-note-viewport {
    min-width: 0;
    max-width: 20em;
    overflow: hidden;
    color: var(--gold);
    white-space: nowrap;
    text-align: right;
  }
  .char-note-text { display: inline-block; white-space: nowrap; }
  .char-note-viewport.is-long { text-overflow: ellipsis; }
  .char-note-input {
    width: 100%;
    min-width: 80px;
    height: 23px;
    box-sizing: border-box;
    border: 1px solid rgba(34,221,255,.38);
    border-radius: 6px;
    background: rgba(3,14,30,.86);
    color: var(--gold);
    font: 600 12px/1 "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    padding: 3px 8px;
    outline: none;
  }
  .char-note-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(34,221,255,.08); }
  @media (max-width: 760px) {
    .char-note-area { max-width: 52%; }
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.015);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    font-size: 12px;
    min-width: 0;
    overflow: hidden;
  }
  .todo-item:hover { border-color: var(--border-glow); background: rgba(255,255,255,0.03); }
  .todo-item.done {
    border-color: rgba(90,232,144,0.25);
    background: rgba(90,232,144,0.05);
    box-shadow: 0 0 8px rgba(90,232,144,0.04);
  }
  .todo-checkbox {
    width: 16px; height: 16px;
    border-radius: 5px;
    border: 2px solid var(--text-faint);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 11px;
    color: transparent;
  }
  .todo-item.done .todo-checkbox {
    border-color: var(--green);
    background: var(--green);
    color: var(--bg);
    box-shadow: 0 0 6px rgba(90,232,144,0.3);
  }
  .todo-label { color: var(--text-dim); font-weight: 600; }
  .todo-item.done .todo-label { color: var(--green); }
  .todo-reset {
    font-size: 10px;
    color: var(--text-faint);
    margin-left: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .todo-reset.urgent { color: var(--gold); }
  .todo-item.abyss-span {
    grid-column: 1 / 3;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    align-items: center;
  }
  .todo-item.abyss-span .abyss-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .todo-item.abyss-span .todo-reset { margin-left: 11px; }

  /* Trial todo item */
  .todo-item.trial-item {
    grid-column: 3 / 4;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .todo-item.trial-item .trial-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .todo-item.trial-item .trial-right {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
  }
  .trial-lv-label {
    font-size: 10px;
    color: var(--text-faint);
    font-weight: 400;
  }
  .trial-lv-input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text-faint);
    padding: 1px 0;
    font-size: 10px;
    font-weight: 400;
    font-family: inherit;
    width: 22px;
    text-align: left;
    outline: none;
    transition: border-bottom-color 0.2s;
  }
  .trial-lv-input:focus { border-bottom-color: var(--gold); }

  /* ===== Add Character Button ===== */
  .add-char-btn {
    width: 100%;
    padding: 10px;
    border: 2px dashed rgba(200,157,255,0.25);
    border-radius: 12px;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
  }
  .add-char-btn:hover {
    border-color: var(--purple);
    color: var(--purple);
    background: rgba(200,157,255,0.04);
    box-shadow: 0 0 16px rgba(200,157,255,0.06);
  }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-faint);
  }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; margin-bottom: 16px; }
  .empty-state .empty-state-hint {
    max-width: 460px;
    margin: -4px auto 18px;
    color: var(--text-muted);
    line-height: 1.7;
  }
  .empty-state .empty-state-action {
    padding: 9px 18px;
    border: 1px solid rgba(48, 214, 255, 0.42);
    border-radius: 8px;
    background: rgba(0, 202, 255, 0.09);
    color: var(--cyan);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .empty-state .empty-state-action:hover {
    background: rgba(0, 202, 255, 0.16);
    border-color: var(--cyan);
  }

  /* ===== Add Account ===== */
  .add-account-btn {
    width: 100%;
    padding: 18px;
    border: 2px dashed rgba(90,170,255,0.3);
    border-radius: 16px;
    background: transparent;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
  }
  .add-account-btn:hover {
    border-color: var(--blue);
    color: var(--blue);
    background: rgba(90,170,255,0.04);
    box-shadow: 0 0 20px rgba(90,170,255,0.06);
  }

  /* ===== Simple Mode Table ===== */
  .simple-table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .simple-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .simple-table th {
    padding: 14px 12px;
    text-align: center;
    border-bottom: 2px solid var(--border-glow);
    color: var(--text-dim);
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s, background 0.2s;
    white-space: nowrap;
    background: rgba(90,170,255,0.05);
  }
  .simple-table th:hover { color: var(--text); background: rgba(90,170,255,0.1); }
  .simple-table th .sort-icon {
    font-size: 10px;
    margin-left: 4px;
    color: var(--gold);
  }
  .simple-table th:not(.sortable) { cursor: default; }
  .simple-table th:not(.sortable):hover { background: rgba(90,170,255,0.05); }
  .simple-table td {
    padding: 10px 12px;
    text-align: center;
    border-bottom: 1px solid var(--glass-border);
    color: var(--text);
  }
  .simple-table tr:hover td { background: rgba(255,255,255,0.02); }
  .simple-table tr:last-child td { border-bottom: none; }
  .simple-table .char-cell {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: flex-start;
  }
  .simple-table .char-cell img {
    height: 22px;
    width: 22px;
    object-fit: contain;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .simple-table .char-cell .char-icon-default { font-size: 16px; }
  .simple-table .char-cell .char-name-text { font-weight: 600; }
  .simple-table .acc-tag {
    font-size: 11px;
    color: var(--text-faint);
    margin-left: 2px;
  }
  .simple-table .aode-cell { font-family: "Consolas","Monaco",monospace; font-weight: 700; }
  .simple-table .aode-cell .aode-total { color: var(--cyan); }
  .simple-table .aode-cell .aode-break { color: var(--text-faint); font-size: 11px; font-weight: 400; }
  .simple-table .dungeon-cell { font-weight: 700; color: var(--gold); }
  .simple-table .todo-cell { font-weight: 700; }
  .simple-table .todo-cell.all { color: var(--green); }
  .simple-table .todo-cell.none { color: var(--red); }
  .simple-table .todo-cell.partial { color: #e8c040; }
  .simple-empty {
    text-align: center;
    padding: 40px;
    color: var(--text-faint);
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(16,22,42,0.85);
    border: 1px solid var(--border-glow);
    color: var(--text);
    padding: 12px 28px;
    border-radius: var(--radius);
    font-size: 13px;
    z-index: 200;
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 1px rgba(255,255,255,0.08);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== 会员到期提醒弹窗 ===== */
  .mem-alert-overlay {
    background: rgba(0,0,0,0.5);
    z-index: 300;
  }
  .mem-alert-box {
    background: #ffffff;
    border: 1px solid rgba(230,57,70,0.4);
    border-radius: var(--radius);
    padding: 22px 26px 18px;
    max-width: 440px;
    width: 90%;
    box-shadow: 0 12px 48px rgba(0,0,0,0.25);
    position: relative;
  }
  .mem-alert-close-x {
    position: absolute;
    top: 8px;
    right: 12px;
    cursor: pointer;
    font-size: 20px;
    color: #999;
    line-height: 1;
    border: none;
    background: transparent;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .mem-alert-close-x:hover { color: #333; background: rgba(0,0,0,0.06); }
  .mem-alert-title {
    font-size: 15px;
    font-weight: 700;
    color: #e63946;
    margin-bottom: 14px;
    text-align: center;
  }
  .mem-alert-list { margin-bottom: 16px; }
  .mem-alert-item {
    color: #e63946;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.7;
    padding: 5px 0;
    border-bottom: 1px dashed rgba(230,57,70,0.25);
  }
  .mem-alert-item:last-child { border-bottom: none; }
  .mem-alert-confirm {
    display: block;
    margin: 0 auto;
    padding: 8px 36px;
    background: #e63946;
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .mem-alert-confirm:hover { opacity: 0.85; }

  /* ===== 基纳图标按钮（统计框行最左圆形） ===== */
  .kina-summary-group {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .kina-summary-val {
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.5px;
    white-space: nowrap;
    opacity: 0.55;
  }

  .kina-icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    width: 40px;
    background: transparent;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    margin-left: 8px;
    padding: 0;
    transition: transform 0.15s, filter 0.2s;
  }
  .kina-icon-btn:hover { transform: scale(1.08); filter: brightness(1.12); }
  .kina-icon-btn svg { height: 40px; width: 40px; display: block; }

  /* ===== 基纳统计弹窗 ===== */
  .kina-modal-overlay {
    background: rgba(0,0,0,0.5);
    z-index: 310;
    -webkit-overflow-scrolling: touch;
  }
  .kina-modal-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 460px;
    max-width: 92%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 48px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .kina-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--glass-border);
  }
  .kina-modal-title { font-size: 16px; font-weight: 700; color: var(--gold); }
  .kina-modal-close {
    cursor: pointer;
    font-size: 20px;
    color: var(--text-faint);
    line-height: 1;
    border: none;
    background: transparent;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .kina-modal-close:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .kina-modal-body {
    overflow-y: auto;
    padding: 14px 20px;
    flex: 1;
  }
  .kina-total-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(255,107,107,0.06);
    border: 1px solid rgba(255,107,107,0.25);
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .kina-total-row svg { width: 26px; height: 26px; flex-shrink: 0; }
  .kina-total-label { font-size: 13px; color: var(--text-faint); }
  .kina-total-val { font-size: 22px; font-weight: 700; color: var(--red); margin-left: auto; }
  .kina-acc-block {
    margin-bottom: 12px;
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .kina-acc-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.03);
  }
  .kina-acc-name { color: var(--text); font-size: 15px; font-weight: 600; }
  .kina-acc-sum { margin-left: auto; color: var(--gold); font-size: 16px; font-weight: 700; }
  .kina-char-list { padding: 4px 0; }
  .kina-char-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 24px;
  }
  .kina-char-row:hover { background: rgba(255,255,255,0.02); }
  .kina-char-row img.kina-char-icon { width: 20px; height: 20px; border-radius: 4px; }
  .kina-char-row .kina-char-icon-fallback {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .kina-char-name {
    font-size: 13px;
    color: var(--text-dim);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 160px;
  }
  .kina-char-input {
    margin-left: auto;
    width: 130px;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--cyan);
    padding: 4px 2px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    text-align: right;
    outline: none;
    transition: border-bottom-color 0.2s;
  }
  .kina-char-input:focus { border-bottom-color: var(--cyan); }
  .kina-char-input::placeholder { color: var(--text-faint); font-weight: 400; opacity: 0.7; }
  .kina-modal-foot {
    padding: 12px 20px;
    border-top: 1px solid var(--glass-border);
    display: flex;
    justify-content: center;
  }
  .kina-save-btn {
    padding: 8px 32px;
    border-radius: 8px;
    border: none;
    background: var(--gold);
    color: #1a1f2e;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .kina-save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .kina-save-btn:not(:disabled):hover { opacity: 0.88; }

  /* ===== 基纳未保存提示弹窗 ===== */
  .kina-confirm-overlay {
    background: rgba(0,0,0,0.5);
    z-index: 320;
  }
  .kina-confirm-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 320px;
    max-width: 90%;
    padding: 20px 22px 16px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.4);
  }
  .kina-confirm-msg { font-size: 14px; color: var(--text); text-align: center; margin-bottom: 16px; }
  .kina-confirm-actions { display: flex; gap: 10px; }
  .kina-confirm-btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .kina-confirm-btn:hover { opacity: 0.85; }
  .kina-confirm-discard { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .kina-confirm-save { background: var(--gold); color: #1a1f2e; }

  /* ===== Responsive ===== */
  @media (max-width: 767px) {
    header h1 { font-size: 20px; }
    .version-tag { font-size: 11px; }
    .summary-chip { min-width: 100px; padding: 8px 14px; }
    .summary-chip .val { font-size: 18px; }
    .account-header { gap: 8px; }
    .acc-stats { gap: 10px; }
    .today-activities { max-width: 100%; min-width: auto; position: static; transform: none; order: -1; width: 100%; }
    .kina-summary-val { font-size: 16px; }
    .directive-section { gap: 4px; padding: 6px 14px; }
    .directive-item { padding: 3px 6px; font-size: 12px; }
  }
  @media (min-width: 768px) {
    .char-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .char-list > .char-card:only-child { grid-column: 1 / -1; }
  }
  @media (min-width: 1024px) {
    main { max-width: 1600px; }
    .summary-bar {
      max-width: 1600px;
      justify-content: center;
      flex-wrap: nowrap;
      padding: 14px 20px;
      gap: 20px;
      position: relative;
    }
    .summary-chip { flex: 0 0 auto; }
    .cap-names { flex: 0 1 auto; justify-content: center; }
    .today-activities {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .kina-summary-group {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      margin-left: 0;
    }
    .char-list { grid-template-columns: 1fr 1fr 1fr; }
  }

  /* ===== OCR 截图识别弹窗 ===== */
  .ocr-modal-overlay {
    background: rgba(0,0,0,0.6);
    z-index: 1050;
  }
  .ocr-modal {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: var(--radius);
    padding: 20px 22px 18px;
    max-width: 520px;
    width: 92%;
    max-height: 88vh;
    overflow-y: auto;
    position: relative;
    box-shadow: var(--shadow);
  }
  .ocr-modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-faint);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    line-height: 1;
  }
  .ocr-modal-close:hover { color: var(--text); border-color: var(--text-dim); background: rgba(255,255,255,0.04); }
  .ocr-modal h3 {
    font-size: 16px;
    margin: 0 36px 14px 0;
    color: var(--cyan);
    font-weight: 700;
  }
  .ocr-action-btn {
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--glass-bg);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .ocr-action-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .ocr-action-btn.primary {
    background: rgba(34,221,255,0.15);
    color: var(--cyan);
    border-color: rgba(34,221,255,0.35);
  }
  .ocr-action-btn.primary:hover { background: rgba(34,221,255,0.25); }
  .ocr-action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .ocr-confirm-panel {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--glass-border);
  }
  .ocr-confirm-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
  }
  .ocr-field-row {
    display: grid;
    grid-template-columns: 88px 1fr 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .ocr-field-row.header {
    color: var(--text-faint);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .ocr-field-label { color: var(--text-dim); font-weight: 600; }
  .ocr-field-val {
    color: var(--text-faint);
    font-family: monospace;
    font-size: 12px;
  }
  .ocr-field-input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(0,0,0,0.25);
    color: var(--text);
    font-size: 12px;
    outline: none;
    font-family: inherit;
  }
  .ocr-field-input:focus { border-color: var(--cyan); }
  .ocr-field-input.changed {
    border-color: rgba(240,204,85,0.5);
    background: rgba(240,204,85,0.06);
    color: var(--gold);
  }
  .ocr-confirm-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    justify-content: flex-end;
  }
  .char-kina-hint {
    font-size: 11px;
    color: var(--red);
    font-weight: 600;
    margin-left: 8px;
    opacity: 0.85;
  }
</style>
</head>
<body>

<header>
  <h1>永恒之塔2 · 统计 <span class="version-tag" id="appVersionTag">V1.3.8</span></h1>
</header>

<div class="summary-bar-wrap">
<div class="summary-bar" id="summaryBar">
  <div class="today-activities" id="todayActivities" style="display:none">
    <div class="today-activities-head">今日活动</div>
    <div class="today-activities-body" id="todayActivitiesBody"></div>
  </div>
  <div class="summary-chip gold">
    <div class="val" id="sumDungeon">0</div>
    <div class="label">剩余副本次数</div>
  </div>
  <div class="summary-chip cyan" style="position:relative;">
    <div class="val" id="sumTotalAode">0</div>
    <div class="label">总剩余奥德<span class="aode-tip-btn" onclick="toggleAodeTip(event)">!</span></div>
    <div class="aode-tip-popup" id="aodeTipPopup"></div>
  </div>
  <div class="summary-chip">
    <div class="val" id="sumCapToday">0</div>
    <div class="label">今日白奥德上限角色</div>
  </div>
  <div class="cap-names" id="capNames">
    <span class="cap-names-empty">暂无角色今日达到上限</span>
  </div>
  <div class="kina-summary-group">
    <span class="kina-summary-val" id="kinaSummaryVal">0</span>
    <button class="kina-icon-btn" onclick="openKinaModal()" title="基纳统计" aria-label="基纳统计">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="kinaG1" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#fff3b0"/>
          <stop offset="55%" stop-color="#f0cc55"/>
          <stop offset="100%" stop-color="#c89518"/>
        </radialGradient>
      </defs>
      <circle cx="20" cy="20" r="18.5" fill="url(#kinaG1)" stroke="#8a6610" stroke-width="1"/>
      <circle cx="20" cy="20" r="15" fill="none" stroke="#8a6610" stroke-width="0.7" opacity="0.4"/>
      <text x="20" y="18.8" text-anchor="middle" font-size="9.5" font-weight="800" fill="#7a5a08" font-family="sans-serif" letter-spacing="0.5">基纳</text>
      <text x="20" y="29.8" text-anchor="middle" font-size="9.5" font-weight="800" fill="#7a5a08" font-family="sans-serif" letter-spacing="0.5">统计</text>
    </svg>
  </button>
  </div>
</div>
</div>

<main>
  <div class="toolbar">
    <h2>账号列表</h2>
    <div class="toolbar-toggles">
      <div class="simple-mode-toggle">
        <input type="checkbox" id="simpleModeToggle" onchange="toggleSimpleMode()" />
        <span>精简模式</span>
      </div>
      <span class="toolbar-sep">|</span>
      <div class="cost-toggle" id="dungeonCostToggle" title="点击切换副本消耗模式">
        <span class="cost-toggle-label">单次副本消耗:</span>
        <span class="cost-toggle-val" id="dungeonCostVal" onclick="toggleDungeonCost()">80</span>
      </div>
    </div>
    <div class="toolbar-actions">
      <button class="tool-btn sync" onclick="openSyncModal()">☁ 同步</button>
      <button class="tool-btn capture" onclick="openCapturePairing()">数据采集</button>
      <button class="tool-btn undo" id="globalUndoBtn" onclick="undoAction()" disabled>撤回</button>
      <button class="tool-btn export" onclick="exportData()">导出数据</button>
      <button class="tool-btn import" onclick="document.getElementById('importFile').click()">导入数据</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
    </div>
  </div>

  <div id="defaultView">
    <div id="accountList"></div>
    <button class="add-account-btn" onclick="addAccount()">+ 添加新账号</button>
  </div>

  <div id="simpleView" style="display:none">
    <div class="simple-table-wrap">
      <table class="simple-table" id="simpleTable"></table>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

  </div>
</div>

<!-- 基纳统计弹窗 -->
<div class="kina-modal-overlay modal-overlay" id="kinaModalOverlay">
  <div class="kina-modal-box">
    <div class="kina-modal-head">
      <div class="kina-modal-title">基纳统计</div>
      <button class="kina-modal-close" onclick="closeKinaModal()" title="关闭">×</button>
    </div>
    <div class="kina-modal-body">
      <div class="kina-total-row">
        <svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="kinaG2" cx="50%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#fff3b0"/>
              <stop offset="55%" stop-color="#f0cc55"/>
              <stop offset="100%" stop-color="#c89518"/>
            </radialGradient>
          </defs>
          <circle cx="14" cy="14" r="12" fill="url(#kinaG2)" stroke="#8a6610" stroke-width="1"/>
          <circle cx="14" cy="14" r="9" fill="none" stroke="#8a6610" stroke-width="0.8" opacity="0.45"/>
          <text x="14" y="18.5" text-anchor="middle" font-size="12" font-weight="800" fill="#7a5a08" font-family="sans-serif">基</text>

      <div id="kinaListBody"></div>
    </div>
    <div class="kina-modal-foot">
      <button class="kina-save-btn" id="kinaSaveBtn" onclick="saveKina()" disabled>保存</button>
    </div>
  </div>
</div>

<!-- 基纳未保存提示弹窗 -->
<div class="kina-confirm-overlay modal-overlay" id="kinaConfirmOverlay">
  <div class="kina-confirm-box">
    <div class="kina-confirm-msg">修改信息未保存</div>
    <div class="kina-confirm-actions">
      <button class="kina-confirm-btn kina-confirm-discard" onclick="discardKinaAndClose()">取消修改</button>
      <button class="kina-confirm-btn kina-confirm-save" onclick="saveKinaAndClose()">保存后关闭</button>
    </div>
  </div>
</div>
